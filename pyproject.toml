[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curbshade"
version = "0.1.0"
description = "Uncertainty-aware accessible and heat-conscious pedestrian routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Mariscal Fernández"}]
dependencies = ["networkx>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
curbshade = "curbshade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
